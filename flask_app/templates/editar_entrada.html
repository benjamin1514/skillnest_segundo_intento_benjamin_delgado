<!DOCTYPE html>
<!-- Formulario de edición -->
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QueridoDiario - Editar Entrada</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/editar_entrada.css') }}">
</head>

<body class="bg-dark text-light">
    <header class="d-flex flex-wrap align-items-center justify-content-between gap-3 py-3 px-3 px-lg-5 bg-danger text-white">
        <h1 class="h3 mb-0">Editar Entrada</h1>
        <nav class="d-flex gap-2">
            <a class="btn btn-outline-light btn-sm" href="/dashboard">Inicio</a>
            <a class="btn btn-outline-light btn-sm" href="/logout">Cerrar Sesión</a>
        </nav>
    </header>

    <main class="container py-4">
        <section class="card border-0 shadow-sm p-4">
        <h2 class="h4 text-danger mb-3">Editar Entrada</h2>

        {% with messages = get_flashed_messages() %}
        {% if messages %}
        {% for message in messages %}
        <p class="mensaje-error alert alert-danger py-2">{{ message }}</p>
        {% endfor %}
        {% endif %}
        {% endwith %}

        <form action="/editar_entrada/{{ entrada.id_entrada }}" method="POST">

            <div class="mb-3">
                <label for="fecha_entrada">Fecha Entrada:</label>
                <input class="form-control" type="date" id="fecha_entrada" name="fecha_entrada"
                    value="{{ form_data['fecha_entrada'] if form_data else entrada.fecha_entrada.strftime('%Y-%m-%d') }}"
                    required>
            </div>

            <div class="mb-3">
                <label for="nota">Notas:</label>
                <textarea class="form-control" id="nota" name="nota" rows="6" minlength="3"
                    required>{{ form_data['nota'] if form_data else entrada.nota }}</textarea>
            </div>

            <div>
                <button class="btn btn-danger" type="submit">Guardar</button>
            </div>
        </form>
        </section>
    </main>
</body>

</html>
