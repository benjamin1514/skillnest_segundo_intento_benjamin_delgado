
<!DOCTYPE html>
<!-- Formulario de nueva entrada -->
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QueridoDiario - Nueva Entrada</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/nueva_entrada.css') }}">
</head>

<body class="bg-dark text-light">
    <header class="py-3 px-3 px-lg-5 bg-danger text-white">
        <h1 class="h3 mb-0">Nueva Entrada</h1>
    </header>

    <nav class="d-flex justify-content-end gap-2 px-3 px-lg-5 py-2 bg-light">
        <a class="btn btn-outline-danger btn-sm" href="/dashboard">Inicio</a>
        <a class="btn btn-outline-danger btn-sm" href="/logout">Cerrar Sesión</a>
    </nav>

    <main class="container py-4">
        <section class="card border-0 shadow-sm p-4">
        <h2 class="h4 text-danger mb-3">Nueva Entrada</h2>

        {% with messages = get_flashed_messages() %}
        {% if messages %}
        {% for message in messages %}
        <p class="alert alert-danger py-2">{{ message }}</p>
        {% endfor %}
        {% endif %}
        {% endwith %}

        <form action="/entradas/crear" method="POST">
            <div class="mb-3">
                <label for="fecha_entrada">Fecha Entrada:</label>
            <input class="form-control" type="date" id="fecha_entrada" name="fecha_entrada" value="{{ fecha_actual }}"
                    min="{{ fecha_actual }}" max="{{ fecha_actual }}" required>
            </div>

            <div class="mb-3">
                <label for="nota">Notas:</label>
            <textarea class="form-control" id="nota" name="nota" rows="6" cols="30"
                    required></textarea>
            </div>

            <div>
            <button class="btn btn-danger" type="submit">Guardar</button>
            </div>
        </form>
        </section>
    </main>
</body>

</html>
